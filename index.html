<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#18271F">
<title>학생회 키우기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Nanum+Pen+Script&display=swap">
<style>
/* One phone-width column: status bar on top, a photo "stage" in the middle (room background,
   teacher above, my character below), action buttons at the bottom. Chrome is chalkboard green,
   cards are paper. Single deliberate look, so every color is set explicitly. */
:root{
  --board:#22362D; --board-hi:#2C4539; --board-lo:#18271F; --glass:rgba(20,34,27,.86);
  --chalk:#F2EFE4; --chalk-dim:#AFBCB0; --chalk-faint:rgba(242,239,228,.14); --chalk-line:rgba(242,239,228,.32);
  --yellow:#F1CF62; --coral:#E8775F; --wood:#B07D4B; --wood-lo:#7E5530;
  --paper:#FAF6EA; --ink:#1E2621; --ink-dim:#5B6559; --tie:#2F5B47; --gold:#C99A2E;
  --floor:#D9B07A; --floor-lo:#C99B62; --wall:#F1E7D6;
  --f-display:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-chalk:'Nanum Pen Script','Jua',cursive;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--board-lo);color:var(--chalk);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance}

.app{height:100%;max-width:460px;margin:0 auto;display:flex;flex-direction:column;background:var(--board);border-inline:6px solid var(--wood-lo)}
@media (max-width:472px){.app{border-inline:0}}

/* status bar */
.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px 8px;background:var(--board-lo);border-bottom:2px solid var(--wood-lo)}
.grade-pill{font-family:var(--f-display);font-size:17px;background:var(--wood);color:var(--paper);padding:1px 11px;border-radius:8px;box-shadow:inset 0 -3px 0 var(--wood-lo)}
.stat{font-size:12.5px;color:var(--chalk-dim);display:flex;align-items:baseline;gap:5px}
.stat b{font-family:var(--f-display);font-weight:400;font-size:18px;color:var(--chalk);font-variant-numeric:tabular-nums}
.hud .score{margin-left:auto}
.chips{flex-basis:100%;display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:2px 9px;border-radius:99px;border:1px solid var(--yellow);color:var(--yellow);background:transparent}
.chip.empty{border-color:var(--chalk-line);color:var(--chalk-dim)}

/* stage */
.stage{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--board-lo)}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center bottom;z-index:0}
.ph{position:absolute;inset:0;z-index:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;padding:0 16% 30%;
  background:repeating-linear-gradient(135deg,transparent 0 16px,rgba(242,239,228,.04) 16px 32px),linear-gradient(var(--board) 0 62%,var(--floor-lo) 62%)}
.ph .place{font-family:var(--f-chalk);font-size:32px;line-height:1.1}
.ph .muted{font-size:12px;color:var(--chalk-dim)}
.mapwrap{position:absolute;inset:0;z-index:0}
.shade{position:absolute;inset:0;z-index:1;background:rgba(10,18,14,.6)}
.me,.npc{position:absolute;z-index:2;width:auto;max-width:none;pointer-events:none;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
.me.center{left:50%;bottom:0;height:54%;transform:translateX(-50%)}
.me.corner{left:-3%;bottom:0;height:31%}
.me.tiny{left:66%;bottom:3%;height:17%}
.npc.center{left:50%;bottom:0;height:58%;transform:translateX(-50%)}
.npc.tl{left:0;top:3%;height:42%}
.npc.top{left:50%;top:3%;height:40%;transform:translateX(-50%)}
.npc.bl{left:2%;bottom:0;height:46%}
.npc.br{right:0;bottom:0;height:46%}
.npc.peek{right:-4%;bottom:0;height:34%}
.layer{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;gap:10px;padding:12px 16px;pointer-events:none;overflow-y:auto}
.layer>*{pointer-events:auto}
.layer .grow{flex:1;pointer-events:none}
.actions{display:flex;flex-direction:column;gap:8px;padding:10px 16px 14px;background:var(--board-lo);border-top:2px solid var(--wood-lo)}
.actions:empty{display:none}
.row{display:flex;gap:8px}.row>*{flex:1}

.btn{border:0;border-radius:14px;padding:13px 16px;font-family:var(--f-display);font-size:19px;background:var(--yellow);color:var(--ink);box-shadow:0 4px 0 #b39232;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b39232}
.btn.ghost{background:transparent;color:var(--chalk);border:2px solid var(--chalk-line);box-shadow:none}
.btn:disabled{opacity:.35;cursor:default}
.link{background:none;border:0;color:var(--chalk-dim);font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:4px}
.muted{color:var(--chalk-dim);font-size:13px}
.center{text-align:center}

.glass{background:var(--glass);border:1px solid var(--chalk-line);border-radius:16px;padding:14px;backdrop-filter:blur(3px)}
.paper{background:var(--paper);color:var(--ink);border-radius:14px;padding:14px 16px;box-shadow:0 6px 0 rgba(0,0,0,.22)}
.chalk{font-family:var(--f-chalk);font-size:24px;line-height:1.2}
.tag{font-size:12px;color:var(--yellow);letter-spacing:.05em}

/* speech bubble */
.bubble{position:relative;background:var(--paper);color:var(--ink);border-radius:16px;padding:10px 14px 12px;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.bubble .who{display:block;font-size:11.5px;color:var(--tie);font-weight:600;margin-bottom:2px}
.bubble .say{font-family:var(--f-chalk);font-size:25px;line-height:1.15}
.bubble.r{margin-left:42%}
.bubble.l{margin-right:30%}

/* title */
.sign{align-self:center;margin-top:6px;background:var(--board);border:8px solid var(--wood);border-radius:10px;box-shadow:inset 0 0 0 2px var(--wood-lo),0 8px 0 rgba(0,0,0,.25);padding:14px 26px 12px;text-align:center}
.sign .eyebrow{font-size:11.5px;letter-spacing:.14em;color:var(--chalk-dim)}
.sign h1{font-size:54px;line-height:1;color:var(--chalk);margin-top:4px}
.sign h1 span{color:var(--yellow)}
.trio{position:absolute;left:0;right:0;bottom:0;height:46%;z-index:2;pointer-events:none}
.trio img{position:absolute;bottom:0;height:88%;width:auto;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
.trio img:nth-child(1){left:50%;transform:translateX(-50%);height:100%;z-index:2}
.trio img:nth-child(2){left:2%}
.trio img:nth-child(3){right:2%}

/* select */
.pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{border:2px solid var(--chalk-line);border-radius:14px;background:rgba(0,0,0,.25);padding:6px 4px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px}
.card img{width:100%;aspect-ratio:2/3;object-fit:contain}
.card h3{font-size:19px}
.card .nums{font-size:11.5px;color:var(--chalk-dim);font-variant-numeric:tabular-nums}
.card[aria-pressed="true"]{border-color:var(--yellow);background:rgba(241,207,98,.14)}
.card[aria-pressed="true"] h3{color:var(--yellow)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;color:var(--chalk-dim)}
.field input{font:inherit;font-size:17px;color:var(--ink);background:var(--paper);border:0;border-radius:10px;padding:10px 12px}

/* center map: the real floor plan picture, rooms are tap areas measured on it (percent of a 2:3 box) */
.mapwrap{container-type:size;background:var(--board-lo)}
.mapbox{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100cqw, calc(100cqh * 2 / 3));aspect-ratio:2/3}
.mapimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:4px}
.room{position:absolute;border:3px solid transparent;border-radius:8px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;padding-top:6px;color:var(--chalk)}
.room .rn{font-family:var(--f-display);font-size:16px;line-height:1.2;background:var(--board);border:2px solid var(--wood);border-radius:7px;padding:1px 9px;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.room .st{font-size:11px;padding:0 8px;border-radius:99px;background:var(--paper);color:var(--ink)}
.room.now{border-color:var(--yellow);background:rgba(241,207,98,.14);box-shadow:0 0 0 4px rgba(241,207,98,.45);animation:glow 1.4s ease-in-out infinite}
.room.now .st{background:var(--yellow)}
.room.done .st{background:var(--tie);color:var(--paper)}
.room.locked{background:rgba(16,26,21,.42)}
.room.deco{cursor:default}
@keyframes glow{50%{box-shadow:0 0 0 8px rgba(241,207,98,.2)}}
.r-small{left:3.9%;top:4.6%;width:24.4%;height:25%}
.r-main{left:36.6%;top:4.6%;width:58.6%;height:36%}
.r-edu{left:62.5%;top:42%;width:32.7%;height:36%}
.r-hall{left:27.8%;top:41.7%;width:33.7%;height:38.4%}
.mapme{position:absolute;left:39%;top:64%;height:14%;pointer-events:none;filter:drop-shadow(0 4px 4px rgba(0,0,0,.35))}
.help{position:absolute;right:14px;top:12px;z-index:4;width:34px;height:34px;border-radius:50%;border:0;background:var(--board);color:var(--chalk);font-family:var(--f-display);font-size:19px;box-shadow:0 3px 0 rgba(0,0,0,.3)}

/* rps */
.hands{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-left:24%}
.hand{border:2px solid var(--chalk-line);border-radius:14px;background:var(--glass);padding:6px;display:flex;flex-direction:column;align-items:center;font-family:var(--f-display);font-size:15px}
.hand img{width:82%;aspect-ratio:1}
.duel{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;text-align:center}
.duel img{width:100%;max-width:110px;aspect-ratio:1;margin:0 auto}
.duel .vs{font-family:var(--f-display);font-size:20px;color:var(--chalk-dim)}
.duel .lbl{font-size:12px;color:var(--chalk-dim)}
.verdict{font-family:var(--f-display);font-size:30px;text-align:center}
.win{color:var(--yellow)}.lose{color:var(--coral)}
.pop-in{animation:popin .35s ease-out}
@keyframes popin{from{transform:scale(.6);opacity:.2}to{transform:none;opacity:1}}
.skillcard{display:flex;gap:12px;align-items:center}
.skillcard .no{font-family:var(--f-display);font-size:40px;line-height:1;color:var(--tie);font-variant-numeric:tabular-nums}
.skillcard .nm{font-family:var(--f-display);font-size:21px;line-height:1.15}
.skillcard .eff{font-size:13px;color:var(--ink-dim)}

/* education room */
.count{display:flex;gap:6px;margin:6px 0 10px}
.count i{flex:1;height:7px;border-radius:4px;background:var(--chalk-faint)}
.count i.used{background:var(--yellow)}
.choice{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--chalk-line);border-radius:14px;background:rgba(0,0,0,.2);padding:11px 12px;width:100%}
.choice+.choice{margin-top:8px}
.choice .ico{width:42px;height:42px;flex:none;border-radius:10px;background:var(--chalk-faint);display:grid;place-items:center;font-family:var(--f-display);font-size:22px}
.choice .ico svg{width:24px;height:24px}
.choice h3{font-size:19px}
.choice p{font-size:12px;color:var(--chalk-dim)}
.choice .gain{margin-left:auto;font-family:var(--f-display);font-size:16px;color:var(--yellow);white-space:nowrap}
.choice:disabled{opacity:.35}

/* arrow game */
.gh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.gh h2{font-size:21px}
.dots{display:flex;gap:5px}
.dots i{width:13px;height:13px;border-radius:50%;border:2px solid var(--chalk-line)}
.dots i.ok{background:var(--yellow);border-color:var(--yellow)}
.dots i.no{background:var(--coral);border-color:var(--coral)}
.timer{height:9px;border-radius:5px;background:var(--chalk-faint);overflow:hidden;margin-top:8px}
.timer i{display:block;height:100%;width:100%;background:var(--yellow);transform-origin:left;will-change:transform}
.timer.low i{background:var(--coral)}
.seq{display:flex;justify-content:center;gap:7px;margin-top:10px}
.tile{width:48px;height:48px;border-radius:11px;border:2px solid var(--chalk-line);display:grid;place-items:center;color:var(--chalk);background:rgba(0,0,0,.15)}
.tile.now{border-color:var(--yellow);box-shadow:0 0 0 3px rgba(241,207,98,.3)}
.tile.done{background:var(--yellow);border-color:var(--yellow);color:var(--ink)}
.tile.bad{background:var(--coral);border-color:var(--coral);color:var(--ink)}
.tile svg,.pad svg{width:26px;height:26px}
.msg{min-height:32px;text-align:center;font-family:var(--f-display);font-size:22px;margin-top:6px}
.pad{align-self:flex-end;display:grid;grid-template-columns:repeat(3,66px);grid-template-rows:repeat(3,62px);gap:7px}
.pad button{border:0;border-radius:14px;background:var(--chalk);color:var(--ink);display:grid;place-items:center;box-shadow:0 4px 0 #b7b3a5}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 #b7b3a5}
.pad .u{grid-area:1/2}.pad .l{grid-area:2/1}.pad .r{grid-area:2/3}.pad .d{grid-area:3/2}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* quiz */
.qcard{font-size:16px;line-height:1.45;font-weight:500}
.qcard .topic{display:block;font-size:11.5px;font-weight:400;color:var(--ink-dim);margin-bottom:2px}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{text-align:left;border:2px solid var(--chalk-line);border-radius:12px;background:var(--glass);padding:10px 12px;font-size:15px;display:flex;gap:10px;align-items:flex-start}
.opt .k{font-family:var(--f-display);color:var(--chalk-dim);flex:none;width:1.1em}
.opt.right{background:var(--yellow);border-color:var(--yellow);color:var(--ink)}
.opt.wrong{background:var(--coral);border-color:var(--coral);color:var(--ink)}
.opt.right .k,.opt.wrong .k{color:var(--ink)}
.opt.gone{opacity:.3;text-decoration:line-through}

/* report card */
.sheet h2{font-size:22px;text-align:center}
.sheet .sub{text-align:center;font-size:12px;color:var(--ink-dim)}
.sheet table{width:100%;border-collapse:collapse;margin-top:8px;font-variant-numeric:tabular-nums}
.sheet td{padding:6px 2px;border-bottom:1px solid #e3dccb;font-size:14px}
.sheet td:last-child{text-align:right;font-family:var(--f-display);font-size:17px}
.sheet tr.total td{border-bottom:0;border-top:2px solid var(--ink);font-weight:600}
.sheet tr.total td:last-child{font-size:22px;color:var(--tie)}
.sheet .note{font-size:12px;color:var(--ink-dim);margin-top:6px}

/* mom event */
.answers{display:flex;flex-direction:column;gap:7px}
.answer{text-align:left;border:2px solid var(--chalk-line);border-radius:12px;background:var(--glass);padding:10px 12px;font-size:14.5px}

/* ending */
.diploma{display:flex;gap:12px;align-items:flex-start;border:3px double var(--tie)}
.diploma.s{border-color:var(--gold)}
.stamp{flex:none;width:58px;height:58px;border-radius:50%;border:3px solid var(--coral);color:var(--coral);display:grid;place-items:center;font-family:var(--f-display);font-size:34px;transform:rotate(-8deg)}
.diploma.s .stamp{border-color:var(--gold);color:var(--gold)}
.diploma .eb{font-size:11.5px;color:var(--ink-dim);letter-spacing:.06em}
.diploma h2{font-size:23px;line-height:1.15}
.diploma .scene{font-family:var(--f-chalk);font-size:21px;line-height:1.15;margin-top:4px}
.diploma .line{font-size:14px;font-weight:500;margin-top:4px}
.diploma .score{display:flex;gap:12px;margin-top:6px;font-size:12px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.diploma .score b{font-family:var(--f-display);font-weight:400;font-size:16px;color:var(--ink)}

/* dex */
.dex{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.slot{border:2px solid var(--chalk-line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:2px;background:var(--glass)}
.slot.seen{border-color:var(--yellow)}
.slot .lt{font-family:var(--f-display);font-size:26px;line-height:1;color:var(--chalk-dim)}
.slot.seen .lt{color:var(--yellow)}
.slot h3{font-size:16px;line-height:1.2}
.slot .range{font-size:11.5px;color:var(--chalk-dim);font-variant-numeric:tabular-nums}

/* room ranking */
.btn.sm{font-size:16px;padding:11px 8px}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rank li{display:grid;grid-template-columns:30px 34px 1fr auto 52px;align-items:center;gap:8px;padding:7px 10px;border-radius:12px;background:var(--glass);border:1px solid var(--chalk-faint)}
.rank li.mine{border:2px solid var(--yellow)}
.rank li.gap{background:none;border:0;padding:0;display:block;text-align:center;color:var(--chalk-dim);font-size:12px;line-height:1}
.rank .no{font-family:var(--f-display);font-size:20px;text-align:center;color:var(--chalk-dim);font-variant-numeric:tabular-nums}
.rank li:nth-child(1) .no{color:var(--yellow)}
.rank .face{width:34px;height:34px;border-radius:50%;background-color:var(--board-hi);background-repeat:no-repeat;background-size:290%;background-position:50% 7%}
.rank .nm{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .nm small{font-weight:500;color:var(--yellow);margin-left:4px}
.rank .gr{font-family:var(--f-display);font-size:15px;color:var(--chalk-dim);border:1px solid var(--chalk-line);border-radius:7px;padding:0 6px}
.rank .sc{font-family:var(--f-display);font-size:18px;text-align:right;font-variant-numeric:tabular-nums}
.rank-note{text-align:center;padding:22px 14px}
.diploma .rankline{color:var(--tie);margin-top:4px;min-height:1em}
.marks{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap}
.marks span{font-size:10.5px;padding:0 6px;border-radius:99px;border:1px solid var(--chalk-line);color:var(--chalk-dim)}
.marks span.on{background:var(--yellow);border-color:var(--yellow);color:var(--ink)}
.picker{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.picker button{border:2px solid var(--chalk-line);border-radius:10px;background:transparent;padding:8px 4px;font-family:var(--f-display);font-size:15px}
.picker button[aria-pressed="true"]{border-color:var(--yellow);color:var(--yellow)}

.snd{width:30px;height:30px;border-radius:50%;border:1px solid var(--chalk-line);background:transparent;display:grid;place-items:center;color:var(--chalk);padding:0}
.snd svg{width:16px;height:16px}
/* skill popover */
.pop{position:absolute;left:16px;right:16px;top:10px;z-index:6}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="app">
  <header class="hud" id="hud" hidden></header>
  <main class="stage" id="stage">
    <img class="bg" id="bg" alt="" hidden>
    <div class="ph" id="ph" hidden></div>
    <div class="mapwrap" id="map" hidden></div>
    <div class="shade" id="shade" hidden></div>
    <img class="me" id="me" alt="" hidden>
    <img class="npc" id="npc" alt="" hidden>
    <div class="layer" id="layer" aria-live="polite"></div>
    <div class="pop" id="pop" hidden></div>
  </main>
  <footer class="actions" id="actions"></footer>
</div>

<script>
/* ================= data ================= */
const IMG = {};
['str','int','bal','str_panic','int_panic','bal_panic','str_adult','int_adult','bal_adult','teacher','teacher_praise','teacher_cheer','mom',
 'rock','scissors','paper','bg_title','room_main','room_edu','room_small','map','scene_g2','scene_g3','scene_g6','end_F','end_D','end_C','end_B','end_A','end_S'
].forEach(k => IMG[k] = 'img/' + k + '.webp');

/* Rooms: set bg to an IMG key once the room photo arrives. */
const ROOMS = {

const TOPICS = ['일반 상식','성경','교회생활'];

/* ================= pure rules (checked offline) ================= */
const RULES = {
  arrowTime(gi, str, s1){ return (GRADES[gi].arrow + 0.1*str) * (s1 ? 1.3 : 1); },
  quizTime(gi, int, long, s2){ return (GRADES[gi].quiz + 0.5*int) * (long ? 1.3 : 1) * (s2 ? 1.3 : 1); },
  arrowCount(owned){ return owned.includes(10) ? 4 : 5; },
  mainScore(a, q){ return a*15 + q*15 + (a===3 && q===3 ? 10 : 0); },
  ending(total){ return total >= 700 ? 5 : total <= 200 ? 0 : total <= 300 ? 1 : total <= 400 ? 2 : total <= 500 ? 3 : 4; },
  reaction(pts){ return pts >= 70 ? 'praise' : pts >= 31 ? 'base' : 'cheer'; },
  drawSkill(owned, rnd=Math.random){
    const pool = Object.keys(SKILLS).map(Number).filter(id => !owned.includes(id)); if (!pool.length) return null;
    const w = pool.map(id => SKILLS[id].w || 1), sum = w.reduce((a,b)=>a+b,0);
    let r = rnd()*sum; for (let k=0;k<pool.length;k++){ r -= w[k]; if (r < 0) return pool[k]; } return pool[pool.length-1];
  },
  rps(me, them){ if (me===them) return 0; return ({rock:'scissors',scissors:'paper',paper:'rock'})[me]===them ? 1 : -1; },
  /* teacher picks a hand so that one throw ends: win 50%, lose 25%, draw 25% */
  teacherHand(me, rnd=Math.random){
    const beats = {rock:'scissors', scissors:'paper', paper:'rock'}, r = rnd();
    if (r < .5) return beats[me];
    if (r < .75) return Object.keys(beats).find(k => beats[k] === me);
    return me;
  },
  pickSet(diff, exclude=[], rnd=Math.random){
    return TOPICS.map(t => {
      const all = Q[diff].filter(q => q[3]===t), fresh = all.filter(q => !exclude.includes(q[0]));
      const pool = fresh.length ? fresh : all; return pool[Math.floor(rnd()*pool.length)];
    });
  },
  applyMom(st, ans){ return {str: Math.max(1, st.str + ans.s), int: Math.max(1, st.int + ans.i)}; }
};

  del(k){ try{ localStorage.removeItem(k); }catch(e){} if (TG.cloud) try{ TG.cloud.removeItem(k, () => {}); }catch(e){} }
};
function cloudSet(k, v){
  if (!TG.cloud) return;
  let s = JSON.stringify(v);
  if (s.length > 4000 && v && v.used) s = JSON.stringify({...v, used: v.used.slice(-12)});  // CloudStorage value cap is 4096 chars
  if (s.length > 4000) return;
  try{ TG.cloud.setItem(k, s, () => {}); }catch(e){}
}

const SND = {
  ctx:null, on: store.get('hsk_sound', true),
  ensure(){
    if (!this.on) return null;
    if (!this.ctx){ const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; try{ this.ctx = new AC(); }catch(e){ return null; } }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  tone(freq, dur, o={}){
    const c = this.ensure(); if (!c) return;
    const t = c.currentTime + (o.when || 0), osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'triangle'; osc.frequency.setValueAtTime(freq, t);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(freq * o.slide, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(o.vol || .12, t + .012); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g).connect(c.destination); osc.start(t); osc.stop(t + dur + .03);
  },
  seq(list, o={}){ list.forEach(([f, d, w]) => this.tone(f, d, {...o, when:w})); },
  play(n){
    if (!this.on) return;
    ({
      tap:() => this.tone(520, .05, {vol:.05}),
      key:() => this.tone(880, .06, {type:'square', vol:.04}),
      ok:() => this.seq([[660,.09,0],[990,.15,.09]]),
      bad:() => this.tone(240, .32, {type:'sawtooth', vol:.07, slide:.6}),
      draw:() => this.seq([[500,.1,0],[500,.1,.14]]),
      lose:() => this.seq([[523,.12,0],[440,.12,.12],[349,.26,.24]]),
      skill:() => this.seq([[523,.08,0],[659,.08,.08],[784,.08,.16],[1047,.24,.24]], {vol:.13}),
      up:() => this.seq([[587,.1,0],[880,.2,.1]]),
      fanfare:() => this.seq([[523,.1,0],[659,.1,.1],[784,.1,.2],[1047,.32,.3]], {vol:.13}),
      soft:() => this.seq([[440,.16,0],[523,.28,.16]], {type:'sine', vol:.1})
    })[n]?.();
  },
  ending(g){
    if (!this.on) return;
    const N = m => 440 * Math.pow(2, (m - 69) / 12), q = .3;
    const mel = {
      F:[[67,.38],[66,.38],[65,.38],[64,1.1]],
      D:[[72,q],[74,q],[76,q],[74,q],[72,q*2]],
      C:[[67,q],[72,q],[76,q],[79,q*2],[76,q],[79,q*3]],
      B:[[67,q],[72,q],[76,q],[79,q],[84,q*2],[79,q],[84,q*3]],
      A:[[72,q],[76,q],[79,q],[84,q],[79,q],[84,q],[88,q*3]],
      S:[[72,.17],[72,.17],[72,.17],[79,.7],[76,.24],[79,.24],[84,1.3]]
    }[g];
    let t = .05;
    mel.forEach(([m, d]) => { this.tone(N(m), d * .95, {type: g === 'F' ? 'sawtooth' : 'triangle', vol: g === 'F' ? .08 : .14, when:t, slide: g === 'F' && d > .5 ? .94 : 0}); t += d; });
    if (g !== 'F'){
      this.tone(N(48), t, {type:'sine', vol:.07, when:.05}); this.tone(N(55), t, {type:'sine', vol:.05, when:.05});
      if (g === 'S' || g === 'A') [72,76,79].forEach(m => this.tone(N(m), 1.4, {type:'sine', vol:.06, when:t - 1.2}));
    }
  },
  toggle(){
    this.on = !this.on; store.set('hsk_sound', this.on);
    if (this.ctx){ this.on ? this.ctx.resume() : this.ctx.suspend(); }
    if (this.on) this.play('ok');
  }
};

    `<button class="btn" id="next">교육실로 가기</button>`);

/* ================= arrow game ================= */
function arrowGame(o){
  const results = o.results || [], round = results.length;
  if (round === 3){ o.onDone(results.filter(Boolean).length); return; }
  const dirs = ['up','down','left','right'], seq = Array.from({length:o.count}, () => dirs[Math.floor(Math.random()*4)]);
  screen({...roomStage(o.room), me:pose(), meMode:'corner'}, `
    <div class="glass">
      <div class="gh"><h2>${o.title}</h2><span class="dots">${[0,1,2].map(i => `<i class="${results[i]===true?'ok':results[i]===false?'no':''}"></i>`).join('')}</span></div>
      <p class="muted">${round+1}번째 · 제한시간 ${sec(o.time)} · 틀리면 실패</p>
      <div class="timer" id="tm"><i></i></div>
      <div class="seq" id="seq">${seq.map(d => `<span class="tile">${arrowSvg(d)}</span>`).join('')}</div>
      <div class="msg" id="msg">준비…</div>
    </div>
    <div class="grow"></div>
    <div class="pad" id="pad">${[['u','up','위'],['l','left','왼쪽'],['r','right','오른쪽'],['d','down','아래']].map(([c,d,a]) => `<button class="${c}" data-d="${d}" aria-label="${a}">${arrowSvg(d)}</button>`).join('')}</div>`, '');
  const my = token, tiles = [...layer.querySelectorAll('.tile')], bar = $('#tm i'), msg = $('#msg');
  let pos = -1, start = 0, over = false;
  const finish = (ok, why) => {
    if (over) return; over = true; cancelAnimationFrame(rafId);
    if (!ok && o.skill3 && !o.skill3Used){
      o.skill3Used = true;
      if (Math.random() < .3){ ok = true; why = '「한 번만 봐주세요」 발동! 성공 처리'; } else why += ' · 「한 번만 봐주세요」 불발';
    }
    msg.innerHTML = `<span class="${ok?'win':'lose'}">${why}</span>`; SND.play(ok ? 'ok' : 'bad');
    if (!ok){ $('#seq').classList.add('shake'); meEl.src = IMG[pose('panic')]; }
    setTimeout(() => { if (my===token) arrowGame({...o, results:[...results, ok]}); }, 950);
  };
  const press = d => {
    if (over || pos < 0) return;
    if (d === seq[pos]){ SND.play('key'); tiles[pos].className = 'tile done'; pos++; if (pos === seq.length) finish(true, '성공!'); else tiles[pos].classList.add('now'); }
    else { tiles[pos].className = 'tile bad'; finish(false, '방향이 틀렸어요'); }
  };
  layer.querySelectorAll('#pad button').forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); press(b.dataset.d); }));
  keyHandler = e => { const m = {ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'}[e.key]; if (m){ e.preventDefault(); press(m); } };
  setTimeout(() => {
    if (my !== token) return;
    msg.textContent = '시작!'; pos = 0; tiles[0].classList.add('now'); start = performance.now();
    const tick = now => {
      if (my !== token || over) return;
      const left = 1 - (now - start) / (o.time*1000);
      bar.style.transform = `scaleX(${Math.max(0,left)})`; $('#tm').classList.toggle('low', left < .3);
      if (left <= 0) finish(false, '시간 초과'); else rafId = requestAnimationFrame(tick);
    };
    rafId = requestAnimationFrame(tick);
  }, 700);
}

/* ================= quiz ================= */
function quizGame(o){
  const results = o.results || [], n = results.length;
  if (n === o.qs.length){ o.onDone(results.filter(Boolean).length); return; }
  const q = o.qs[n], t = o.time(q), opts = shuffle([q[1], ...q[2]]), gone = o.remove1 ? shuffle(q[2])[0] : null;
  screen({...roomStage(o.room), me:pose(), meMode:'corner'}, `
    <div class="glass">
      <div class="gh"><h2>${o.title}</h2><span class="dots">${o.qs.map((_,i) => `<i class="${results[i]===true?'ok':results[i]===false?'no':''}"></i>`).join('')}</span></div>
      <p class="muted">${n+1}번째 · 제한시간 ${sec(t)}${q[4]?' (긴 문제 1.3배)':''}${o.retry?' · 재도전':''}</p>
      <div class="timer" id="tm"><i></i></div>
    </div>
    <div class="paper qcard"><span class="topic">${q[3]}</span>${esc(q[0])}</div>
    <div class="opts">${opts.map((x,i) => `<button class="opt ${x===gone?'gone':''}" data-o="${esc(x)}" ${x===gone?'disabled':''}><span class="k">${i+1}</span><span>${esc(x)}</span></button>`).join('')}</div>
    <div class="msg" id="msg"></div>`, '');
  const my = token, bar = $('#tm i'), msg = $('#msg'), start = performance.now();
  let over = false;
  const finish = picked => {
    if (over) return; over = true; cancelAnimationFrame(rafId);
    const ok = picked === q[1];
    layer.querySelectorAll('.opt').forEach(b => { if (b.dataset.o === q[1]) b.classList.add('right'); else if (b.dataset.o === picked) b.classList.add('wrong'); b.disabled = true; });
    const miss = picked === null ? '시간 초과' : '오답'; SND.play(ok ? 'ok' : 'bad');
    if (!ok){ meEl.src = IMG[pose('panic')]; }
    if (!ok && o.skill4 && !o.skill4Used){
      o.skill4Used = true;
      if (Math.random() < .3){
        msg.innerHTML = `<span class="win">「다시 한번 기회」 발동! 같은 문제 재도전</span>`;
        setTimeout(() => { if (my===token) quizGame({...o, results, retry:true}); }, 1100); return;
      }
      msg.innerHTML = `<span class="lose">${miss} · 「다시 한번 기회」 불발</span>`;
    } else msg.innerHTML = ok ? `<span class="win">정답!</span>` : `<span class="lose">${miss}</span>`;
    setTimeout(() => { if (my===token) quizGame({...o, results:[...results, ok], retry:false}); }, 1300);
  };
  layer.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => finish(b.dataset.o)));
  const tick = now => {
    if (my !== token || over) return;
    const left = 1 - (now - start) / (t*1000);
    bar.style.transform = `scaleX(${Math.max(0,left)})`; $('#tm').classList.toggle('low', left < .3);
    if (left <= 0) finish(null); else rafId = requestAnimationFrame(tick);
  };
  rafId = requestAnimationFrame(tick);
}

function mainStart(){

      <p class="muted">화살표 ${n}개 · ${sec(at)} / 퀴즈 난이도 ${g.diff} (일반·성경·교회생활)</p>

function report(a, qn){
  const g = GRADES[S.gi], pts = RULES.mainScore(a, qn), last = S.gi === 5, react = RULES.reaction(pts);
  S.scores.push(pts); SND.play({praise:'fanfare', base:'ok', cheer:'soft'}[react]);
  const cum = S.scores.reduce((x,y)=>x+y,0), nextLabel = last ? '' : GRADES[S.gi+1].label;
  const tpose = {praise:'teacher_praise', base:'teacher', cheer:'teacher_cheer'}[react];
  screen({...roomStage('main'), npc:tpose, npcMode:'br', me:pose(react === 'praise' ? '' : 'panic'), meMode:'corner'}, `
    <div class="paper sheet">
      <h2>${g.label} 성적표</h2><p class="sub">${esc(S.name)} · ${CHARS[S.char].name} · ${g.event}</p>
      <table><tr><td>화살표 ${a}/3 성공</td><td>${a*15}</td></tr><tr><td>퀴즈 ${qn}/3 정답</td><td>${qn*15}</td></tr>
      <tr><td>모두 통과 보너스</td><td>${a===3&&qn===3?10:0}</td></tr><tr class="total"><td>${g.label} 점수</td><td>${pts}</td></tr></table>
      <p class="note">누적 ${cum}점 · ${last ? '이제 졸업이에요' : `다음은 ${nextLabel}`}</p>
    </div>

    `<button class="btn" id="next">${last ? '졸업식으로' : `${nextLabel}로 올라가기`}</button>`);
  if (last) S.phase = 'done';
  else { S.gi++; S.practiceLeft = 3; S.phase = S.gi === 3 ? 'mom' : 'intro'; }
  persist();
  on('next', route);
}

  const d = store.get(DEX, {}); const key = ENDINGS[idx].g; d[key] = d[key] || {}; d[key][S.char] = true; store.set(DEX, d);
  const best = store.get(BEST, 0), isBest = total > best; if (isBest) store.set(BEST, total);

}

/* ================= room ranking =================
   Scores are grouped by Telegram's chat_instance, which is only known to people who open
   the game from a link inside that group chat, so strangers can never appear on a room's board. */
const RANK_API = 'https://tubular-raindrop-22f885.netlify.app/api/rank';   // Netlify function in netlify/functions/rank.mjs
const PENDING = 'hsk_rank_pending';
const tgRoom = () => (TG.app && TG.app.initDataUnsafe && TG.app.initDataUnsafe.chat_instance) || '';
const tgUid = () => String((TG.app && TG.app.initDataUnsafe && TG.app.initDataUnsafe.user && TG.app.initDataUnsafe.user.id) || '');
const rankReady = () => !!(RANK_API && tgRoom() && tgUid());
function rankCall(entry){
  const room = encodeURIComponent(tgRoom()), uid = encodeURIComponent(tgUid());
  const req = entry
    ? fetch(RANK_API, {method:'POST', body: JSON.stringify({...entry, room: tgRoom(), uid: tgUid(), init: TG.app.initData || ''})})
    : fetch(`${RANK_API}?room=${room}&uid=${uid}`);
  return req.then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
}
function submitRank(entry, lineEl){
  if (!rankReady()) return;
  if (lineEl) lineEl.textContent = '이 방 랭킹에 올리는 중…';
  rankCall(entry).then(res => {
    store.del(PENDING);
    if (lineEl && lineEl.isConnected && res.me) lineEl.textContent = res.me.rank === 1 ? `이 방 랭킹 1위! (${res.total}명 중)` : `이 방 랭킹 ${res.me.rank}위 · ${res.total}명 중`;
  }).catch(() => { if (lineEl && lineEl.isConnected) lineEl.textContent = '랭킹은 다음에 게임을 열 때 다시 올릴게요.'; });
}
function retryPendingRank(){ const p = store.get(PENDING, null); if (p && rankReady()) submitRank(p, null); }
function rankScreen(){
  const shell = body => screen({bg:'bg_title', shade:true}, `
    <div><h2 style="font-size:26px">이 방 랭킹</h2><p class="muted" id="rsub">개인 최고점 기준</p></div>${body}`,
    `<button class="btn ghost" id="home">처음으로</button>`, false);
  const note = t => `<div class="glass rank-note"><p class="muted">${t}</p></div>`;
  const done = () => on('home', title);
  if (!RANK_API){ shell(note('랭킹 서버를 준비하고 있어요.')); return done(); }
  if (!tgRoom() || !tgUid()){ shell(note('단톡방에 올라온 게임 링크로 열면<br>그 방 사람들끼리 랭킹을 볼 수 있어요.')); return done(); }
  shell(`<div id="rbody">${note('불러오는 중…')}</div>`); done();
  const my = token;
  rankCall(null).then(res => {
    if (my !== token) return;
    $('#rsub').textContent = `${res.total}명 참여 · 개인 최고점 기준`;
    if (!res.top.length){ $('#rbody').innerHTML = note('아직 이 방에서 졸업한 사람이 없어요.<br>첫 번째 졸업생이 되어 보세요!'); return; }
    const row = r => `<li class="${r.me ? 'mine' : ''}"><span class="no">${r.rank}</span><span class="face" style="background-image:url(${IMG[r.char] || IMG.bal})"></span>
      <span class="nm">${esc(r.name)}${r.me ? '<small>나</small>' : ''}</span><span class="gr">${r.g}</span><span class="sc">${r.score}</span></li>`;
    const mine = res.me && res.me.rank > res.top.length ? `<li class="gap">⋮</li>${row(res.me)}` : '';
    $('#rbody').innerHTML = `<ol class="rank">${res.top.map(row).join('')}${mine}</ol>`;
    const meRow = $('#rbody .mine'); if (meRow && meRow.scrollIntoView) meRow.scrollIntoView({block:'nearest'});
  }).catch(e => { if (my === token) $('#rbody').innerHTML = note(`랭킹을 불러오지 못했어요.<br>잠시 후 다시 열어 주세요.<br><small>(${esc(/^\d+$/.test(e && e.message) ? '서버 응답 ' + e.message : '서버 연결 실패')})</small>`); });
}

/* ================= dex ================= */
function dex(){
  const d = store.get(DEX, {}), best = store.get(BEST, 0), seen = ENDINGS.filter(e => d[e.g]).length;
  screen({bg:'bg_title', shade:true}, `
    <div><h2 style="font-size:26px">엔딩 도감</h2><p class="muted">${seen}/6 발견 · 같은 등급도 캐릭터마다 문장이 달라요 · 개인 최고 ${best}점</p></div>
    <div class="dex">${ENDINGS.map(e => { const s = !!d[e.g]; return `<div class="slot ${s?'seen':''}">
      <span class="lt">${e.g}</span><h3>${s ? e.name : '???'}</h3><span class="range">${e.range}</span>
      <div class="marks">${Object.entries(CHARS).map(([k,c]) => `<span class="${d[e.g]&&d[e.g][k]?'on':''}">${c.name}</span>`).join('')}</div></div>`; }).join('')}</div>`,
    `<button class="btn ghost" id="home">처음으로</button>`, false);
  on('home', title);
}
function previewPicker(){
  let ei = 0, ch = 'str';
  const draw = () => {
    screen({bg:'bg_title', shade:true}, `
      <div><h2 style="font-size:24px">엔딩 화면 미리보기</h2><p class="muted">문장과 배치를 확인하는 시험용 메뉴예요. 도감과 기록에는 남지 않아요.</p></div>
      <div class="glass"><p class="tag">등급</p><div class="picker" style="margin-top:6px">${ENDINGS.map((e,i) => `<button data-e="${i}" aria-pressed="${i===ei}">${e.g}</button>`).join('')}</div>
      <p class="tag" style="margin-top:12px">캐릭터</p><div class="picker" style="margin-top:6px">${Object.entries(CHARS).map(([k,c]) => `<button data-c="${k}" aria-pressed="${k===ch}">${c.name}</button>`).join('')}</div></div>`,
      `<button class="btn" id="show">이 엔딩 보기</button><button class="link" id="home">처음으로</button>`, false);
    layer.querySelectorAll('[data-e]').forEach(b => b.addEventListener('click', () => { ei = +b.dataset.e; draw(); }));
    layer.querySelectorAll('[data-c]').forEach(b => b.addEventListener('click', () => { ch = b.dataset.c; draw(); }));
    on('home', title);
    on('show', () => { const v = [180,260,350,450,560,600][ei]; endingScreen(ei, ch, store.get(NAME,'') || '학생', {base:v, bonus:ei===5?100:0, total:ei===5?700:v, isBest:false}, true); });
  };
  draw();
}

/* ================= boot ================= */
Object.values(IMG).forEach(src => { const i = new Image(); i.src = src; });

/* Inside Telegram: load the Mini App SDK, fit the window, stop swipe-down from closing the
   game mid-quest, then pull cloud saves before the title screen. Outside Telegram none of this runs. */
function loadScript(src){
  return new Promise(res => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = res; document.head.appendChild(s); setTimeout(res, 4000); });
}
function pullCloud(){
  return new Promise(res => {
    const t = setTimeout(res, 2500);
    try{
      TG.cloud.getItems(CLOUD_KEYS, (err, vals) => {
        clearTimeout(t);
        if (!err && vals){
          const cv = k => { try{ return vals[k] ? JSON.parse(vals[k]) : undefined; }catch(e){ return undefined; } };
          const lv = k => store.get(k, undefined);
          const cd = cv(DEX), ld = lv(DEX);
          if (cd || ld){ const m = {...(cd || {})}; Object.entries(ld || {}).forEach(([g,o]) => m[g] = {...(m[g] || {}), ...o}); store.set(DEX, m); }
          const cb = cv(BEST), lb = lv(BEST); if (cb != null || lb != null) store.set(BEST, Math.max(cb || 0, lb || 0));
          if (cv(TUTK) || lv(TUTK)) store.set(TUTK, true);
          const cn = cv(NAME), ln = lv(NAME); if (ln || cn) store.set(NAME, ln || cn);
          const cs = cv(SAVE), ls = lv(SAVE), pick = !ls ? cs : !cs ? ls : ((cs.t || 0) > (ls.t || 0) ? cs : ls);
          if (pick) store.set(SAVE, pick);
          const cso = cv('hsk_sound'); if (cso !== undefined && lv('hsk_sound') === undefined){ store.set('hsk_sound', cso); SND.on = cso; }
        }
        res();
      });
    }catch(e){ clearTimeout(t); res(); }
  });
}
async function boot(){
  if (inTelegram){
    await loadScript('https://telegram.org/js/telegram-web-app.js');
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg){
      TG.app = tg;
      const at = v => { try{ return tg.isVersionAtLeast(v); }catch(e){ return false; } };
      try{ tg.ready(); tg.expand(); }catch(e){}
      try{ if (at('7.7')) tg.disableVerticalSwipes(); }catch(e){}
      try{ if (at('6.1')){ tg.setHeaderColor('#18271F'); tg.setBackgroundColor('#18271F'); } }catch(e){}
      if (at('6.9') && tg.CloudStorage){ TG.cloud = tg.CloudStorage; await pullCloud(); }
    }
  }
  title();
  retryPendingRank();
}
boot();
